name: Build English dictionary pack

on:
  workflow_dispatch:
    inputs:
      language:
        description: Target learner language
        required: true
        type: choice
        options: [ja, es]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Download, validate, and generate pack
        env:
          LANGUAGE: ${{ inputs.language }}
        run: |
          set -euo pipefail
          case "$LANGUAGE" in
            ja) TARGET_PATTERN='^[ぁ-んァ-ヶー々〆〤一-龯]{1,32}$' ;;
            es) TARGET_PATTERN='^[a-záéíóúüñ-]{2,48}$' ;;
          esac
          SOURCE_URL=https://kaikki.org/dictionary/raw-wiktextract-data.jsonl.gz
          VERSION=$(date -u +%Y.%m.%d)
          mkdir -p build/pack
          curl --fail --location --retry 3 --retry-all-errors --output build/source.jsonl.gz "$SOURCE_URL"
          gzip -t build/source.jsonl.gz
          SOURCE_SHA=$(sha256sum build/source.jsonl.gz | awk '{print $1}')
          LANGUAGE="$LANGUAGE" TARGET_PATTERN="$TARGET_PATTERN" VERSION="$VERSION" SOURCE_URL="$SOURCE_URL" SOURCE_SHA="$SOURCE_SHA" python3 - <<'PY'
          import gzip, hashlib, json, os, re
          from collections import defaultdict

          language = os.environ['LANGUAGE']
          target_pattern = re.compile(os.environ['TARGET_PATTERN'], re.I)
          english_pattern = re.compile(r"^[a-z][a-z '-]{0,47}$", re.I)
          values = defaultdict(list)

          with gzip.open('build/source.jsonl.gz', 'rt', encoding='utf-8') as source:
              for line in source:
                  try:
                      record = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  english_word = str(record.get('word', '')).strip().lower()
                  if record.get('lang_code') != 'en' or not english_pattern.fullmatch(english_word):
                      continue
                  for translation in record.get('translations', []):
                      target_word = str(translation.get('word', '')).strip().lower()
                      if translation.get('code') != language or not target_pattern.fullmatch(target_word):
                          continue
                      if target_word not in values[english_word]:
                          values[english_word].append(target_word)

          entries = {word: {'glosses': translations[:4]} for word, translations in values.items()}
          if len(entries) < 5000:
              raise SystemExit(f'Only {len(entries)} English entries passed validation')

          payload = {'format': f'voicecamera.en-{language}.kaikki.v1', 'entries': entries}
          raw = json.dumps(payload, ensure_ascii=False, separators=(',', ':')).encode('utf-8')
          with open('build/pack/dictionary.json', 'wb') as output:
              output.write(raw)
          manifest = {
              'id': f'en-{language}', 'sourceLanguage': 'en', 'targetLanguage': language,
              'version': os.environ['VERSION'], 'format': payload['format'],
              'entryCount': len(entries), 'dictionarySha256': hashlib.sha256(raw).hexdigest(),
              'source': {'name': 'Kaikki.org English Wiktionary JSONL', 'url': os.environ['SOURCE_URL'], 'sha256': os.environ['SOURCE_SHA']},
          }
          with open('build/pack/manifest.json', 'w', encoding='utf-8') as output:
              json.dump(manifest, output, ensure_ascii=False, indent=2)
          PY
          cp LICENSE.txt build/pack/LICENSE.txt
          cp NOTICE.txt build/pack/NOTICE.txt
          tar -C build/pack -czf "build/voicecamera-en-$LANGUAGE-$VERSION.tar.gz" dictionary.json manifest.json LICENSE.txt NOTICE.txt
          sha256sum "build/voicecamera-en-$LANGUAGE-$VERSION.tar.gz" > "build/voicecamera-en-$LANGUAGE-$VERSION.tar.gz.sha256"
      - name: Update catalog
        env:
          LANGUAGE: ${{ inputs.language }}
        run: |
          set -euo pipefail
          LANGUAGE="$LANGUAGE" python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          language = os.environ['LANGUAGE']
          manifest = json.loads(Path('build/pack/manifest.json').read_text(encoding='utf-8'))
          archive = next(Path('build').glob(f'voicecamera-en-{language}-*.tar.gz'))
          pack = {
              'id': f'en-{language}', 'sourceLanguage': 'en', 'targetLanguage': language,
              'version': manifest['version'],
              'url': f'https://github.com/YeseoFamily/voicecamera-dictionary-packs/releases/download/packs/en-{language}-{manifest["version"]}/{archive.name}',
              'sha256': hashlib.sha256(archive.read_bytes()).hexdigest(),
              'entryCount': manifest['entryCount'], 'license': 'CC BY-SA 4.0',
              'attribution': 'Derived from Kaikki.org/Wiktionary data; see bundled NOTICE.txt.',
          }
          path = Path('packs/index.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          ids_to_replace = {f'en-{language}', f'{language}-en'}
          data['packs'] = [item for item in data.get('packs', []) if item.get('id') not in ids_to_replace]
          data['packs'].append(pack)
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packs/index.json
          git commit -m "chore: publish en-$LANGUAGE dictionary pack" || true
          git push
      - name: Create release
        env:
          LANGUAGE: ${{ inputs.language }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import json; print(json.load(open('build/pack/manifest.json'))['version'])")
          TAG="packs/en-$LANGUAGE-$VERSION"
          gh release create "$TAG" "build/voicecamera-en-$LANGUAGE-$VERSION.tar.gz" "build/voicecamera-en-$LANGUAGE-$VERSION.tar.gz.sha256" --title "English → $LANGUAGE dictionary pack $VERSION" --notes "English-to-$LANGUAGE dictionary pack derived from Kaikki.org/Wiktionary data. See the bundled NOTICE.txt and LICENSE.txt."
